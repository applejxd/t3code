name: Release (fork)

# Fork-only release pipeline for applejxd/t3code. It replaces release.yml,
# which is hard-gated to pingdotgg/t3code (`resolve_commit` is skipped on any
# other repository, so a tag push here runs release.yml as an all-skipped no-op).
#
# One run publishes a GitHub Release holding:
#   - the CLI archives scripts/install.sh downloads (linux-x64, linux-arm64,
#     darwin-arm64) plus the Windows CLI zip scripts/install.ps1 downloads,
#     and the SHA256SUMS file both installers verify against;
#   - the Windows x64 desktop installer, with its updater manifest (latest.yml).
#
# Versioning: push a `v<base>-fork.<n>` tag, for example v0.1.10-fork.1, where
# <base> is the upstream x.y.z the build is based on and <n> counts this fork's
# releases of it. Upstream tags plain vX.Y.Z and only the -nightly. and
# -preview. suffixes, so a -fork. tag can never collide with a tag fetched from
# upstream, whatever upstream releases next. scripts/install.sh and install.ps1
# pick the newest fork release by base version, then <n>, and use a plain vX.Y.Z
# release only when there is no fork release. `t3 update` and the mobile update
# check rank the same way (packages/shared/src/cliRelease.ts) and never offer a
# plain release of the running build's base or older. The desktop app's feed is
# this repository too: its publish config takes GITHUB_REPOSITORY at build time
# (scripts/build-desktop-artifact.ts), and electron-updater orders by semver.
#
# The full fork version (0.1.10-fork.1) is used unchanged for everything built;
# nothing strips the suffix:
#   - The installers derive the archive name from the tag, as
#     t3-<version>-<platform>-<arch>, so the archives must carry it.
#   - It is valid semver, as nightly versions already are for electron-builder
#     and the CLI archive builder, and the updater orders it by <n>.
#   - latest.yml carries the app's own version, so it matches what the desktop
#     app compares against. electron-builder would name the feed after the
#     version's prerelease label (fork.yml) only for generic and S3 feeds; for
#     the GitHub provider the desktop build uses, it stays latest.yml.
#
# T3 Connect: builds bake the public Clerk and relay identifiers from
# .env.example, which point at upstream's production relay (as upstream's own
# PR previews do).
#
# Unsigned: no Apple or Azure credentials exist here. The mac CLI archive is
# signed ad hoc (fine for curl installs) and the Windows installer is unsigned,
# so SmartScreen will warn. No secrets are passed to release-desktop.yml.
#
# Dropped from release.yml: nightly/preview trains, the quality and test gates,
# the Cloudflare relay lookup, npm, AUR, Vercel, Discord, and the version-bump
# commit to main. Run CI separately before tagging.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-fork.[0-9]+"
  # The file must be on the default branch for the Run workflow button to exist.
  workflow_dispatch:
    inputs:
      version:
        description: "Full fork version to release, without the v (for example 0.1.10-fork.1). Builds the selected branch or tag."
        required: true
        type: string
      draft:
        description: "Create a draft release: no git tag, and invisible to install.sh until you publish it."
        required: false
        default: true
        type: boolean

# Per version, so two quick tags both run instead of the second replacing the first in the queue.
concurrency:
  group: release-fork-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  # release-desktop.yml's Windows job lists this run's artifacts.
  actions: read
  contents: read

jobs:
  preflight:
    name: Resolve release
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
      clerk_publishable_key: ${{ steps.meta.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.meta.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.meta.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.meta.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: /.env.example
          sparse-checkout-cone-mode: false

      - id: meta
        name: Resolve version and public config
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw="$DISPATCH_VERSION"
            draft="$DISPATCH_DRAFT"
          else
            raw="$GITHUB_REF_NAME"
            draft=false
          fi
          version="${raw#v}"
          # x.y.z-fork.n only: the installers look for exactly this form, and it
          # cannot collide with an upstream tag.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]]; then
            echo "::error::Release version must look like x.y.z-fork.n, for example 0.1.10-fork.1 (got '$raw')."
            exit 1
          fi
          tag="v$version"

          # An existing tag must be the commit being built, or the assets and the tag disagree.
          existing="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk 'END { print $1 }')"
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag already points at $existing, but this run builds $GITHUB_SHA."
            exit 1
          fi

          # The public T3 Connect identifiers upstream bakes into every build
          # (see .env.example). The Cloudflare lookup release.yml uses for
          # them needs upstream credentials, so read the same values from the file.
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          clerk_publishable_key="$(env_example CLERK_PUBLISHABLE_KEY)"
          clerk_jwt_template="$(env_example CLERK_JWT_TEMPLATE)"
          clerk_cli_oauth_client_id="$(env_example CLERK_CLI_OAUTH_CLIENT_ID)"
          relay_url="$(env_example RELAY_URL)"
          for name in clerk_publishable_key clerk_jwt_template clerk_cli_oauth_client_id relay_url; do
            if [[ -z "${!name}" ]]; then
              echo "::error::.env.example has no value for $name."
              exit 1
            fi
          done

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "draft=$draft"
            echo "clerk_publishable_key=$clerk_publishable_key"
            echo "clerk_jwt_template=$clerk_jwt_template"
            echo "clerk_cli_oauth_client_id=$clerk_cli_oauth_client_id"
            echo "relay_url=$relay_url"
          } >> "$GITHUB_OUTPUT"

  # The platform-independent JS (server bundle, web client, Electron main) is
  # built once here and handed to every packaging job as `js-bundle`.
  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.preflight.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.preflight.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.preflight.outputs.relay_url }}
      # Upstream reports its own builds as stable/nightly; any other repository reports "dev".
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # Runs t3#build (which depends on @t3tools/web#build) and the desktop
      # bundle, so apps/server/dist holds the server bundle plus the web client
      # and apps/desktop/dist-electron the Electron main.
      - name: Build JS bundle
        run: vp run build:desktop:bundle

      # Two paths under apps/ so the artifact root is apps/; consumers download
      # into `apps` to restore both at their original locations.
      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 3

  # The self-contained CLI archive for each platform install.sh supports, built
  # on hardware of its own architecture. There is no darwin-x64: install.sh
  # refuses Intel Macs, because Node single-executables are unsupported there.
  # This is release-desktop.yml's CLI path without the desktop packaging, which
  # keeps these jobs short on the small hosted runners. Artifact names are
  # cli-<platform>-<arch>, the names release-desktop.yml and the release job use.
  cli_archive:
    name: Build ${{ matrix.label }}
    needs: [preflight, build_bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
          - label: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.preflight.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.preflight.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.preflight.outputs.relay_url }}
      # The executable bundles the server again, so it needs the same stamp as build_bundle.
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      # Same checkout as release-desktop.yml: checkout's credential cleanup runs
      # submodule foreach even with submodules disabled, which fails on the
      # orphaned gitlinks in the vendored .repos tree. This repository is public.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # The artifact root is `apps/`, so extracting into `apps` restores
      # apps/server/dist and apps/desktop/dist-electron at their build paths.
      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      # The CLI archive ships apps/server/dist/client, which the desktop build
      # brands the same way.
      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      # Setup Vite+ selects the exact engines.node version from package.json,
      # and the single-executable embeds that Node.
      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$target_dir/"

      # The Linux archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install patchelf and libatomic
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf libatomic1

      # No Apple credentials: scripts/build-cli-archive.ts signs the mac
      # executable ad hoc and skips notarization.
      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.preflight.outputs.version }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error
          # The archive is already gzip; deflating it again saves under 2%.
          compression-level: 0

  # Built on Linux like upstream's Windows jobs, with the native checks on a
  # Windows runner. The Windows desktop embeds the same-arch Linux CLI archive
  # as its WSL runtime, so this waits for every cli_archive leg and the
  # artifact is already there when the job starts. Also builds and uploads the
  # Windows CLI zip (cli-win-x64) and the installer (desktop-win-x64).
  # No secrets are passed, so the build is unsigned. arm64 is not built.
  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, build_bundle, cli_archive]
    uses: ./.github/workflows/release-desktop.yml
    permissions:
      actions: read
      contents: read
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      # No production relay state to read, so no tracing config exists.
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  release:
    name: Publish GitHub Release
    needs: [preflight, cli_archive, desktop_win_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download Windows desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win-x64
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # The names scripts/install.sh and install.ps1 request, plus the installer.
      # Fail here, before publishing, if a build renamed or dropped one.
      - name: Check release assets
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          ls -l
          missing=0
          for file in \
            "t3-${VERSION}-linux-x64.tar.gz" \
            "t3-${VERSION}-linux-arm64.tar.gz" \
            "t3-${VERSION}-darwin-arm64.tar.gz" \
            "t3-${VERSION}-win32-x64.zip" \
            "T3-Code-${VERSION}-x64.exe"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing release asset $file"
              missing=1
            fi
          done
          exit "$missing"

      # release-desktop.yml suffixes each Windows manifest with its arch so two
      # arches can coexist (see merge-release-update-manifests.ts). This release
      # has one arch, so the manifest only needs its plain channel name.
      # builder-debug.yml is electron-builder's config dump, not a feed.
      - name: Name the Windows updater manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          rm -f builder-debug.yml
          manifests=(*-win-x64.yml)
          if [[ ${#manifests[@]} -ne 1 ]]; then
            echo "::warning::Expected one Windows updater manifest, found ${#manifests[@]}; the installer will not auto-update."
          else
            mv "${manifests[0]}" "${manifests[0]%-win-x64.yml}.yml"
          fi
          ls -l

      # Installers verify archives against this file, so it is written from the
      # bytes that get uploaded.
      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum t3-*.tar.gz t3-*.zip > SHA256SUMS
          cat SHA256SUMS

      # The updater manifest and its blockmaps only matter to the desktop
      # updater, so a build that produced no manifest still ships its installer.
      - id: release_files
        name: Resolve release asset list
        shell: bash
        run: |
          {
            echo 'files<<EOF'
            echo 'release-assets/*.exe'
            echo 'release-assets/t3-*.tar.gz'
            echo 'release-assets/t3-*.zip'
            echo 'release-assets/SHA256SUMS'
            if [[ -f release-assets/latest.yml ]]; then
              echo 'release-assets/latest.yml'
              echo 'release-assets/*.blockmap'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: T3 Code (fork) ${{ needs.preflight.outputs.tag }}
          body: |
            Unofficial build of the applejxd/t3code fork, built from `${{ github.sha }}`.
            The Windows installer is unsigned, so SmartScreen will warn before it runs.
          generate_release_notes: true
          draft: ${{ needs.preflight.outputs.draft == 'true' }}
          prerelease: false
          make_latest: ${{ needs.preflight.outputs.draft == 'true' && 'false' || 'true' }}
          files: ${{ steps.release_files.outputs.files }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}
